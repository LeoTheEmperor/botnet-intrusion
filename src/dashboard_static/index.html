<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IoT Botnet Intrusion Monitor</title>
<style>
:root{--bg:#0f1419;--panel:#171e27;--line:#26303c;--text:#e6edf3;--muted:#8b98a5;
      --ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;--idle:#64748b}
@media (prefers-color-scheme: light){
  :root{--bg:#f3f5f8;--panel:#ffffff;--line:#dde3ea;--text:#16202a;--muted:#5b6b7a}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
.sub{margin:2px 0 0;color:var(--muted);font-size:13px}
main{max-width:1100px;margin:0 auto;padding:16px 20px 40px;display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.live{color:var(--ok);border-color:var(--ok)} .pill.stale{color:var(--warn);border-color:var(--warn)}
.pill.off{color:var(--bad);border-color:var(--bad)} .pill.idle{color:var(--idle)}
.status{padding:28px 20px;text-align:center;border-width:2px;transition:background .3s,border-color .3s}
.status .label{font-size:clamp(26px,6vw,46px);font-weight:800;letter-spacing:.02em}
.status .detail{margin-top:6px;color:var(--muted)}
.status.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
.status.ok .label{color:var(--ok)}
.status.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--panel))}
.status.warn .label{color:var(--warn)}
.status.alert{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--panel))}
.status.alert .label{color:var(--bad)}
.status.idle{border-color:var(--line)} .status.idle .label{color:var(--idle)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi .v{font-size:26px;font-weight:700} .kpi .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.barrow{display:grid;grid-template-columns:110px 1fr 78px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.fill{height:100%;border-radius:5px}
.barrow .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px} td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600} .none{color:var(--muted);font-size:13px}
#chart svg{display:block;width:100%;height:170px;border-radius:6px;background:color-mix(in srgb,var(--line) 35%,transparent)}
.tip{position:fixed;z-index:5;background:#000d;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;pointer-events:none;max-width:260px}
</style>
</head>
<body>
<header>
  <div><h1>IoT Botnet Intrusion Monitor</h1><p class="sub" id="source">from-scratch Random Forest on streaming N-BaIoT features</p></div>
  <span id="pill" class="pill idle">CONNECTING</span>
</header>
<main>
  <section id="status" class="card status idle"><div class="label" id="slabel">Waiting for traffic&hellip;</div><div class="detail" id="sdetail"></div></section>
  <section class="kpis">
    <div class="card kpi"><div class="v" id="k-packets">0</div><div class="k" id="kl-packets">packets classified</div></div>
    <div class="card kpi"><div class="v" id="k-pps">0</div><div class="k" id="kl-pps">packets / second</div></div>
    <div class="card kpi"><div class="v" id="k-windows">0</div><div class="k">windows analysed</div></div>
    <div class="card kpi"><div class="v" id="k-alerts">0</div><div class="k">alert episodes</div></div>
  </section>
  <section class="card"><h2>Timeline &mdash; packets per window, coloured by predicted class</h2>
    <div id="chart"></div><div class="legend" id="legend"></div></section>
  <div class="two">
    <section class="card"><h2>Traffic by class (since start)</h2><div id="bars"></div></section>
    <section class="card"><h2>Alert log</h2><div id="alerts"></div></section>
  </div>
</main>
<div class="tip" id="tip" hidden></div>
<script>
"use strict";
var PALETTE = ["#38bdf8","#f97316","#a78bfa","#f43f5e","#eab308","#14b8a6","#ec4899","#84cc16","#fb7185","#60a5fa"];
var colors = {}, nextColor = 0, lastState = null;
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pretty(l){ return String(l).replace(/_/g, " "); }
function fmt(n){ return Number(n).toLocaleString("en-US"); }
function colorOf(label, benign){
  if (label === benign) return "#22c55e";
  if (!(label in colors)) { colors[label] = PALETTE[nextColor % PALETTE.length]; nextColor++; }
  return colors[label];
}
function setPill(text, cls){ var p = $("pill"); p.textContent = text; p.className = "pill " + cls; }

function render(s){
  lastState = s;
  var benign = s.benign_label, h = s.history, cur = h.length ? h[h.length - 1] : null;
  if (s.source) $("source").textContent = "source: " + s.source + " \u00b7 " + s.classes.length + " classes \u00b7 from-scratch Random Forest";

  // connection pill
  var age = s.last_push ? (s.server_time - s.last_push) : null;
  if (!cur) setPill("WAITING", "idle");
  else if (s.finished) setPill("FINISHED", "idle");
  else if (age > Math.max(5, 3 * s.window_s)) setPill("NO DATA", "stale");
  else setPill("LIVE", "live");

  // status card
  var card = $("status");
  if (!cur) {
    card.className = "card status idle"; $("slabel").textContent = "Waiting for traffic\u2026"; $("sdetail").textContent = "";
  } else {
    var state = cur.alert ? "alert" : (cur.label === benign ? "ok" : "warn");
    card.className = "card status " + state;
    $("slabel").textContent = cur.alert ? "ALERT: " + pretty(cur.label).toUpperCase()
                            : (cur.label === benign ? "NORMAL TRAFFIC" : "SUSPICIOUS: " + pretty(cur.label).toUpperCase());
    $("sdetail").textContent = Math.round(cur.share * 100) + "% of " + fmt(cur.packets) + " " + (s.unit || "packets") + " in the last window were classified as \u201c" +
                               pretty(cur.label) + "\u201d \u00b7 t+" + cur.t.toFixed(0) + " s" + (cur.truth ? " \u00b7 ground truth: " + pretty(cur.truth) : "");
  }

  // KPIs
  var unit = s.unit || "packets"; $("kl-packets").textContent = unit + " classified"; $("kl-pps").textContent = unit + " / second";
  $("k-packets").textContent = fmt(s.packets);
  $("k-pps").textContent = cur ? fmt(Math.round(cur.packets / (s.window_s || 1))) : "0";
  $("k-windows").textContent = fmt(s.windows);
  $("k-alerts").textContent = fmt(s.n_alerts);

  renderChart(s); renderBars(s); renderAlerts(s);
}

function renderChart(s){
  var h = s.history, n = h.length, maxLen = s.history_len, W = 1000, H = 170, bw = W / maxLen, benign = s.benign_label;
  var seen = [], max = 1, i, k;
  for (i = 0; i < n; i++) { if (h[i].packets > max) max = h[i].packets; for (k in h[i].counts) if (seen.indexOf(k) < 0) seen.push(k); }
  seen.sort(function(a, b){ return a === benign ? -1 : (b === benign ? 1 : a < b ? -1 : 1); });
  var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" id="svg">', off = (maxLen - n) * bw;
  for (i = 0; i < n; i++) {
    var y = H - 6, x = off + i * bw, c = h[i].counts, j;
    for (j = 0; j < seen.length; j++) {
      var v = c[seen[j]] || 0; if (!v) continue;
      var bh = Math.max(1, (v / max) * (H - 14)); y -= bh;
      out += '<rect x="' + x.toFixed(2) + '" y="' + y.toFixed(1) + '" width="' + Math.max(1, bw - 0.6).toFixed(2) + '" height="' + bh.toFixed(1) + '" fill="' + colorOf(seen[j], benign) + '"/>';
    }
    if (h[i].truth) out += '<rect x="' + x.toFixed(2) + '" y="' + (H - 5) + '" width="' + Math.max(1, bw - 0.6).toFixed(2) + '" height="5" fill="' + colorOf(h[i].truth, benign) + '"/>';
    if (h[i].alert) out += '<rect x="' + x.toFixed(2) + '" y="0" width="' + Math.max(1, bw - 0.6).toFixed(2) + '" height="4" fill="#ef4444"/>';
  }
  $("chart").innerHTML = out + "</svg>";
  var lg = ""; for (i = 0; i < seen.length; i++) lg += '<span><i style="background:' + colorOf(seen[i], benign) + '"></i>' + esc(pretty(seen[i])) + "</span>";
  var hasTruth = n && h[n - 1].truth;
  $("legend").innerHTML = lg + (n ? '<span><i style="background:#ef4444"></i>alert window</span>' : "") + (hasTruth ? '<span>thin strip at the bottom = ground truth</span>' : "");
  var svg = $("svg"); if (!svg) return;
  svg.onmousemove = function(ev){
    var r = svg.getBoundingClientRect(), idx = Math.floor(((ev.clientX - r.left) / r.width) * maxLen) - (maxLen - n);
    var tip = $("tip"); if (idx < 0 || idx >= n) { tip.hidden = true; return; }
    var w = h[idx], parts = [], key;
    for (key in w.counts) parts.push(esc(pretty(key)) + ": " + fmt(w.counts[key]));
    tip.innerHTML = "<b>t+" + w.t.toFixed(0) + " s</b>" + (w.alert ? " &middot; ALERT" : "") + (w.truth ? "<br>truth: " + esc(pretty(w.truth)) : "") + "<br>" + parts.join("<br>");
    tip.style.left = Math.min(ev.clientX + 14, window.innerWidth - 270) + "px"; tip.style.top = (ev.clientY + 14) + "px"; tip.hidden = false;
  };
  svg.onmouseleave = function(){ $("tip").hidden = true; };
}

function renderBars(s){
  var keys = Object.keys(s.totals).sort(function(a, b){ return s.totals[b] - s.totals[a]; }), total = 0, i, out = "";
  for (i = 0; i < keys.length; i++) total += s.totals[keys[i]];
  if (!keys.length) { $("bars").innerHTML = '<div class="none">No traffic classified yet.</div>'; return; }
  for (i = 0; i < keys.length; i++) {
    var v = s.totals[keys[i]], pct = total ? (v / total) * 100 : 0;
    out += '<div class="barrow"><span>' + esc(pretty(keys[i])) + '</span><div class="track"><div class="fill" style="width:' + pct.toFixed(1) +
           '%;background:' + colorOf(keys[i], s.benign_label) + '"></div></div><span class="n">' + fmt(v) + " (" + pct.toFixed(0) + "%)</span></div>";
  }
  $("bars").innerHTML = out;
}

function renderAlerts(s){
  if (!s.alerts.length) { $("alerts").innerHTML = '<div class="none">No alerts so far.</div>'; return; }
  var out = "<table><tr><th>time</th><th>class</th><th>share</th></tr>", i;
  for (i = 0; i < s.alerts.length; i++) {
    var a = s.alerts[i];
    out += "<tr><td>t+" + a.t.toFixed(0) + " s</td><td>" + esc(pretty(a.label)) + "</td><td>" + Math.round(a.share * 100) + "%</td></tr>";
  }
  $("alerts").innerHTML = out + "</table>";
}

function tick(){
  fetch("/api/state", {cache: "no-store"})
    .then(function(r){ if (!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(render)
    .catch(function(){ setPill("OFFLINE", "off"); });
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
